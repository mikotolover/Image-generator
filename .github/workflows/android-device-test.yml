name: Android device verification
on:
  push:
    branches: [codex/android-apk]
    paths: ['device-tests/**', '.github/workflows/android-device-test.yml']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: APK artifact build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: dual-image-maker-apk
          path: device-apk
          run-id: ${{ inputs.build_run_id || '38694901981' }}
          github-token: ${{ github.token }}
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test the exact delivered APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: SAVE_LOCATION_ONLY=1 node device-tests/verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-verification
          path: device-results/
          if-no-files-found: warn
          retention-days: 30
